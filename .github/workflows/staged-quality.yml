name: Staged API Quality Gate

on:
  push:
    branches: [main, "optimization/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Lint API package
        run: ruff check api tests
      - name: Compile API package
        run: python -m compileall api
      - name: Run tests
        run: pytest -q
      - name: Build container image
        run: docker build --tag nobleport-api:ci .

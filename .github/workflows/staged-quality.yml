name: Staged API Quality Gate

on:
  push:
    branches: [main, "optimization/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Lint API package
        run: ruff check api tests
      - name: Compile API package
        run: python -m compileall api
      - name: Run tests
        run: python -m pytest -q
      - name: Build container image
        run: docker build --tag nobleport-api:ci .
      - name: Smoke-test staged API and PostgreSQL
        env:
          POSTGRES_PASSWORD: ci-local-only-password
          GCAGENT_API_TOKENS: ci-local-only-bearer-token
        run: |
          set -euo pipefail
          docker compose up --build --detach
          trap 'docker compose down --volumes --remove-orphans' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health/live > /tmp/live.json; then
              break
            fi
            sleep 2
          done
          test -s /tmp/live.json
          test "$(python -c 'import json; print(json.load(open("/tmp/live.json"))["status"])')" = "alive"
          readiness_code="$(curl --silent --output /tmp/ready.json --write-out '%{http_code}' http://127.0.0.1:8000/health/ready)"
          test "$readiness_code" = "503"
          python -c 'import json; data=json.load(open("/tmp/ready.json")); assert data["checks"]["database"]["ok"] is True; assert data["checks"]["field_ops_persistence"]["ok"] is True'
